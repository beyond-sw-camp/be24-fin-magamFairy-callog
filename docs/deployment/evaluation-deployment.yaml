apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-blue
  namespace: callog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation
  template:
    metadata:
      labels:
        app: evaluation
        version: blue
    spec:
      containers:
      - name: evaluation
        image: tahcy/callogevaluation-1.0-blue
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: callog-backend-config
        volumeMounts:
        - name: config-volume
          mountPath: /config
      volumes:
      - name: config-volume
        configMap:
          name: callog-backend-config