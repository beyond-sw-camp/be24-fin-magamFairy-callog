apiVersion: apps/v1
kind: Deployment
metadata:
  name: aijudge-blue
  namespace: callog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aijudge
  template:
    metadata:
      labels:
        app: aijudge
        version: blue
    spec:
      containers:
      - name: aijudge
        image: tahcy/callogaijudge-1.0-blue
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: callog-backend-config
        volumeMounts:
        - name: config-volume
          mountPath: /config
      volumes:
      - name: config-volume
        configMap:
          name: callog-backend-config