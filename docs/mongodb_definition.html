<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Document 구조 명세서</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Highlight.js for JSON syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-light.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .menu-item.active {
            background-color: #eff6ff;
            color: #1d4ed8;
            border-right: 3px solid #3b82f6;
            font-weight: 600;
        }

        /* JSON Code block styling */
        pre code.hljs {
            border-radius: 0.75rem;
            padding: 1.5rem;
            font-size: 0.875rem;
            line-height: 1.5;
            background-color: #fafafa;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- Sidebar (Collections & DTOs Menu) -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col h-full shadow-sm z-10 flex-shrink-0">
        <div class="p-5 border-b border-slate-100 flex items-center gap-3">
            <div class="bg-emerald-100 text-emerald-600 p-2 rounded-lg">
                <i class="fa-solid fa-leaf text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-slate-800">NoSQL Spec</h1>
                <p class="text-xs text-slate-500">MongoDB Documents</p>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto py-4" id="sidebar-menu">
            <!-- Menu items will be injected here by JS -->
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 relative">
        <!-- Top Header -->
        <header class="bg-white px-8 py-5 border-b border-slate-200 flex items-center justify-between shadow-sm z-10">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span id="module-badge" class="px-2.5 py-1 text-xs font-bold rounded-md bg-indigo-100 text-indigo-700">Module</span>
                    <span class="text-sm text-slate-400"><i class="fa-solid fa-angle-right"></i></span>
                    <span id="domain-badge" class="px-2.5 py-1 text-xs font-bold rounded-md bg-blue-100 text-blue-700 uppercase tracking-wide">Domain</span>
                    <span class="text-sm text-slate-400"><i class="fa-solid fa-angle-right"></i></span>
                    <span class="text-sm font-medium text-slate-500" id="type-label">Collection</span>
                </div>
                <h2 id="collection-title" class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    Select an Item
                </h2>
            </div>
        </header>

        <!-- Document Details -->
        <div class="flex-1 overflow-y-auto p-8" id="content-area" style="display: none;">
            <div class="max-w-5xl mx-auto space-y-6">
                
                <!-- Description Card -->

                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-slate-800 mb-1">설계 포인트 (Design Note)</h3>
                        <p id="collection-desc" class="text-sm text-slate-600 leading-relaxed">
                            Description goes here.
                        </p>
                    </div>
                </div>

                <!-- Fields Table -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex justify-between items-center">
                        <h3 class="font-bold text-slate-800"><i class="fa-solid fa-list text-slate-400 mr-2"></i> Schema Fields</h3>
                        <span class="text-xs text-slate-500 border border-slate-200 px-2 py-1 rounded bg-white font-mono" id="class-name">Class</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                                <tr>
                                    <th class="px-5 py-3 w-1/4">Field Name</th>
                                    <th class="px-5 py-3 w-1/6">Type</th>
                                    <th class="px-5 py-3 w-1/6">Mapping / Index</th>
                                    <th class="px-5 py-3">Description</th>
                                </tr>
                            </thead>
                            <tbody id="fields-tbody" class="divide-y divide-slate-100">
                                <!-- Field rows injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Example JSON -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-12">
                    <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex justify-between items-center">
                        <h3 class="font-bold text-slate-800"><i class="fa-solid fa-code text-slate-400 mr-2"></i> Example JSON</h3>
                        <button onclick="copyJson()" class="text-xs text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
                            <i class="fa-regular fa-copy"></i> Copy
                        </button>
                    </div>
                    <div class="p-0">
                        <pre><code id="json-example" class="language-json block"></code></pre>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-slate-400">
            <i class="fa-solid fa-database text-6xl mb-4 text-slate-200"></i>

        </div>
    </main>

        const colors = {
            emerald: "bg-emerald-100 text-emerald-600",
            blue: "bg-blue-100 text-blue-600",
            indigo: "bg-indigo-100 text-indigo-600",
            violet: "bg-violet-100 text-violet-600",
            orange: "bg-orange-100 text-orange-600",
            rose: "bg-rose-100 text-rose-600",
            pink: "bg-pink-100 text-pink-600"
        };

        const badgeColors = {
            emerald: "bg-emerald-100 text-emerald-700",
            blue: "bg-blue-100 text-blue-700",
            indigo: "bg-indigo-100 text-indigo-700",
            violet: "bg-violet-100 text-violet-700",
            orange: "bg-orange-100 text-orange-700",
            rose: "bg-rose-100 text-rose-700",
            pink: "bg-pink-100 text-pink-700"
        };

        // DOM Load
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            // Automatically select the first item
            const firstModule = Object.keys(schemaData)[0];
            const firstDomain = Object.keys(schemaData[firstModule])[0];
            const firstItem = schemaData[firstModule][firstDomain][0];
            
            // Allow time for DOM insertion before clicking
            setTimeout(() => {
                const firstBtn = document.querySelector('.menu-item');
                if(firstBtn) selectItem(firstModule, firstDomain, firstItem.id, firstBtn);
            }, 50);
        });

        let currentJson = "";

        // Render Sidebar
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            sidebar.innerHTML = '';
            
            Object.keys(schemaData).forEach(moduleName => {
                // Module Title
                const moduleHeader = document.createElement('div');
                moduleHeader.className = 'px-5 mt-4 mb-2 text-sm font-extrabold text-slate-800 flex items-center gap-2';
                moduleHeader.innerHTML = `<i class="fa-solid fa-cube text-indigo-500"></i> ${moduleName}`;
                sidebar.appendChild(moduleHeader);

                const domains = schemaData[moduleName];
                Object.keys(domains).forEach(domainName => {
                    // Domain Title
                    const domainHeader = document.createElement('div');
                    domainHeader.className = 'px-8 mt-2 mb-2 text-xs font-bold text-slate-400 uppercase tracking-wider';
                    domainHeader.innerText = domainName;
                    sidebar.appendChild(domainHeader);
    
                    // Items
                    domains[domainName].forEach(item => {
                        const btn = document.createElement('button');
                        btn.className = `menu-item w-full text-left px-8 py-2.5 text-sm text-slate-600 hover:bg-slate-50 transition-colors flex items-center gap-3`;
                        btn.onclick = () => selectItem(moduleName, domainName, item.id, btn);
                        
                        const colorClass = colors[item.color] || "bg-slate-100 text-slate-600";
                        
                        btn.innerHTML = `
                            <div class="w-6 h-6 rounded flex items-center justify-center ${colorClass} text-xs">
                                <i class="fa-solid ${item.icon}"></i>
                            </div>
                            <span class="font-medium truncate">${item.name}</span>
                        `;
                        sidebar.appendChild(btn);
                    });
                });
            });
        }

        // Handle Selection
        function selectItem(moduleName, domainName, itemId, btnElement) {
            // Update Active State in menu
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            // Find Data
            const domainItems = schemaData[moduleName][domainName];
            const item = domainItems.find(c => c.id === itemId);
            if (!item) return;

            // Hide empty state, show content
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('content-area').style.display = 'block';

            // Update Header
            const moduleBadge = document.getElementById('module-badge');
            moduleBadge.innerText = moduleName;

            const badge = document.getElementById('domain-badge');
            badge.innerText = domainName;
            badge.className = `px-2.5 py-1 text-xs font-bold rounded-md uppercase tracking-wide ${badgeColors[item.color]}`;
            
            document.getElementById('type-label').innerText = domainName === "Collection" ? "MongoDB Collection" : "Data Transfer Object";
            
            document.getElementById('collection-title').innerHTML = `
                <i class="fa-solid ${item.icon} text-${item.color}-500 mr-2"></i> ${item.name}
            `;
            
            // Update Desc & Class Name
            document.getElementById('collection-desc').innerText = item.desc;
            document.getElementById('class-name').innerText = item.className;

            // Update Fields Table
            const tbody = document.getElementById('fields-tbody');
            tbody.innerHTML = '';
            item.fields.forEach(f => {
                let refBadge = '';
                if(f.ref === '@Id' || f.ref === 'Unique Index' || f.ref.includes('Alias')) {
                    refBadge = `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-bold">${f.ref}</span>`;
                } else if(f.ref === 'Embedded' || f.ref === 'Nested') {
                    refBadge = `<span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-bold border border-indigo-100">${f.ref}</span>`;
                } else if(f.ref.includes('@Created') || f.ref.includes('@Last')) {
                    refBadge = `<span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-bold border border-emerald-100">${f.ref}</span>`;
                } else if(f.ref !== '-') {
                    refBadge = `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-bold">${f.ref}</span>`;
                } else {
                    refBadge = `<span class="text-slate-400 text-xs">-</span>`;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-5 py-3 font-medium text-slate-900 font-mono text-sm break-words">${f.name}</td>
                        <td class="px-5 py-3 text-purple-600 font-mono text-xs">${f.type}</td>
                        <td class="px-5 py-3">${refBadge}</td>
                        <td class="px-5 py-3 text-slate-600 text-sm">${f.desc}</td>
                    </tr>
                `;
            });

            // Update JSON Example
            currentJson = item.json;
            const jsonBlock = document.getElementById('json-example');
            jsonBlock.textContent = item.json;
            
            // Apply syntax highlighting
            jsonBlock.removeAttribute('data-highlighted');
            hljs.highlightElement(jsonBlock);
        }

        // Copy JSON Function
        function copyJson() {
            if(!currentJson) return;
            navigator.clipboard.writeText(currentJson).then(() => {
                const btn = document.querySelector('button[onclick="copyJson()"]');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check text-green-600"></i> <span class="text-green-600">Copied!</span>`;
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                }, 2000);
            });
        }
    </script>
