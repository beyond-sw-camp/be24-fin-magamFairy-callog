<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callog B2B SaaS - 통합 대화형 API 명세 콘솔 💡</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           Core Design System & B2B Harmony Theme
           ========================================================================== */
        :root {
            --bg-base: #060b13;
            --bg-surface: #0b111e;
            --bg-card: #111a2e;
            --bg-active: rgba(99, 102, 241, 0.12);
            --border-color: rgba(255, 255, 255, 0.06);
            --border-focus: #5f5ce6;
            
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #4b5563;
            
            /* Curated HSL Brand Colors */
            --color-indigo: #6366f1;
            --color-purple: #8b5cf6;
            --color-emerald: #10b981;
            --color-rose: #f43f5e;
            --color-amber: #f59e0b;
            
            --sidebar-width: 340px;
            --console-width: 500px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* ==========================================================================
           Sidebar Tree-view Layout (Domain -> Controller -> Endpoint)
           ========================================================================== */
        aside.sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-brand {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.1);
        }

        .sidebar-brand i {
            font-size: 22px;
            background: linear-gradient(135deg, var(--color-indigo), var(--color-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-brand h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .domain-tree-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 8px;
        }

        .menu-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-left: 12px;
        }

        /* Hierarchical Domain Collapse */
        .domain-node {
            margin-bottom: 6px;
            border-radius: 6px;
            overflow: hidden;
        }

        .domain-node-header {
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 6px;
            text-align: left;
        }

        .domain-node-header:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .domain-node.active .domain-node-header {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--color-indigo);
            border-radius: 0 6px 6px 0;
        }

        .domain-node-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .domain-node-title i {
            width: 16px;
            text-align: center;
            font-size: 14px;
            color: var(--color-indigo);
        }

        .domain-node-arrow {
            font-size: 11px;
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .domain-node.active .domain-node-arrow {
            transform: rotate(180deg);
        }

        /* Controllers Sub-menu Container */
        .controllers-list {
            display: none;
            padding: 4px 0 4px 12px;
            background-color: rgba(0, 0, 0, 0.08);
            border-left: 1px dashed rgba(255, 255, 255, 0.05);
            margin-left: 20px;
        }

        .domain-node.active .controllers-list {
            display: block;
        }

        .controller-node {
            margin-bottom: 2px;
        }

        .controller-node-header {
            width: 100%;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
            border-radius: 4px;
        }

        .controller-node-header:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .controller-node.active .controller-node-header {
            color: var(--color-purple);
            font-weight: 700;
        }

        .controller-node.active .controller-node-header i.domain-node-arrow {
            transform: rotate(180deg);
        }

        /* Endpoints List (API Functions) */
        .endpoints-list {
            display: none;
            padding: 2px 0 2px 8px;
        }

        .controller-node.active .endpoints-list {
            display: block;
        }

        .endpoint-btn {
            width: 100%;
            padding: 6px 8px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-family: 'Fira Code', monospace;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .endpoint-btn:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.03);
        }

        .endpoint-btn.active {
            color: #ffffff;
            background-color: var(--bg-active);
            font-weight: 600;
        }

        .endpoint-method {
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 2px 4px;
            border-radius: 3px;
            flex-shrink: 0;
            width: 48px;
            text-align: center;
        }
        .endpoint-method.get { background-color: rgba(16, 185, 129, 0.12); color: var(--color-emerald); }
        .endpoint-method.post { background-color: rgba(99, 102, 241, 0.15); color: var(--color-indigo); }
        .endpoint-method.put { background-color: rgba(245, 158, 11, 0.12); color: var(--color-amber); }
        .endpoint-method.patch { background-color: rgba(139, 92, 246, 0.12); color: var(--color-purple); }
        .endpoint-method.delete { background-color: rgba(244, 63, 94, 0.12); color: var(--color-rose); }

        /* ==========================================================================
           Main Workspace Layout
           ========================================================================== */
        main.workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-base);
        }

        header.top-bar {
            height: 72px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background-color: var(--bg-surface);
            flex-shrink: 0;
        }

        .top-bar-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar-title h2 {
            font-size: 15px;
            font-weight: 700;
        }

        .wrapper-pill {
            background-color: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--color-emerald);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .split-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .main-scrollable-container {
            flex-grow: 1;
            overflow-y: auto;
            height: 100%;
        }

        .content-scrollable {
            padding: 32px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Detail API Template View */
        .api-detail-view {
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .api-badge-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .api-detail-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .api-detail-desc {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .spec-section-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-purple);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .spec-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .spec-card-header {
            padding: 12px 20px;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .spec-card-body {
            padding: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.5;
            background-color: #080c14;
            color: #d1d5db;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        /* Action bar for running console */
        .api-view-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 32px;
        }

        .btn-open-console {
            background-color: var(--color-indigo);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        .btn-open-console:hover {
            background-color: #4f46e5;
            transform: translateY(-1px);
        }

        /* ==========================================================================
           Interactive Console Panel
           ========================================================================== */
        aside.console-panel {
            width: var(--console-width);
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            z-index: 5;
            transform: translateX(100%);
            display: none;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .console-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .console-header h3 {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .console-header h3 i {
            color: var(--color-purple);
        }

        .close-console-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }

        .close-console-btn:hover {
            color: var(--text-primary);
        }

        .console-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .console-info-banner {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 14px;
            font-size: 12.5px;
        }

        .console-meta-path {
            font-family: 'Fira Code', monospace;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .case-select-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .case-select-group label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .case-dropdown {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .case-dropdown:focus {
            border-color: var(--border-focus);
        }

        .payload-textarea-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .payload-textarea-container label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .console-payload-field {
            width: 100%;
            height: 180px;
            background-color: #080c14;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: #d1d5db;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            outline: none;
            resize: none;
            transition: border-color 0.2s;
        }

        .console-payload-field:focus {
            border-color: var(--border-focus);
        }

        .btn-console-submit {
            width: 100%;
            background-color: var(--color-indigo);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-console-submit:hover {
            background-color: #4f46e5;
        }

        .console-response-box {
            flex-grow: 1;
            background-color: #080c14;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 250px;
        }

        .response-bar {
            padding: 10px 16px;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .response-badge {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--color-emerald);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
        }

        .response-badge.fail {
            background-color: rgba(244, 63, 94, 0.15);
            color: var(--color-rose);
        }

        .response-text-viewer {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: #d1d5db;
            white-space: pre-wrap;
            position: relative;
        }

        .response-loader {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(8, 12, 20, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.05);
            border-top: 3px solid var(--color-indigo);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Shaking & Animation effects */
        .shaking-element {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--color-rose) !important;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.15) !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Blank State Views */
        .blank-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 60px;
            gap: 16px;
        }

        .blank-state i {
            font-size: 48px;
            color: rgba(255, 255, 255, 0.03);
        }

        .blank-state h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .blank-state p {
            font-size: 13px;
            max-width: 320px;
            line-height: 1.5;
        }

        /* Toast notifications container */
        #toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .custom-toast {
            min-width: 320px;
            max-width: 420px;
            background-color: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 5px solid var(--color-indigo);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.4);
            animation: toastIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
            backdrop-filter: blur(12px);
        }

        .custom-toast.error {
            border-left-color: var(--color-rose);
        }

        .custom-toast.error i {
            color: var(--color-rose);
        }

        .custom-toast i {
            font-size: 16px;
            color: var(--color-indigo);
            margin-top: 2px;
        }

        .toast-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .toast-body {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        @keyframes toastIn {
            from { transform: translateX(120%) scale(0.9); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes toastOut {
            from { transform: translateX(0) scale(1); opacity: 1; }
            to { transform: translateX(120%) scale(0.9); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Real-time dynamic Toast popup notifications -->
    <div id="toast-container"></div>

    <!-- ==========================================================================
       Sidebar Navigation Panel (Interactive Domain Tree)
       ========================================================================== -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-cube"></i>
            <h1>Callog B2B API Console</h1>
        </div>
        <div class="domain-tree-container">
            <h2 class="menu-title">비즈니스 도메인 인프라</h2>
            <div id="domain-list-container">
                <!-- Javascript will load Domain -> Controller -> Endpoint trees here -->
            </div>
        </div>
    </aside>

    <!-- ==========================================================================
       Main Workspace Content
       ========================================================================== -->
    <main class="workspace">
        <header class="top-bar">
            <div class="top-bar-title">
                <h2>Callog 통합 API 대화형 테스트베드</h2>
                <span class="wrapper-pill">Spring Cloud MSA 기반</span>
            </div>
            <div style="font-size: 12px; color: var(--text-secondary); font-weight: 600;">
                Common Response Envelope: <span style="color: var(--color-emerald);">BaseResponse&lt;T&gt;</span>
            </div>
        </header>

        <div class="split-container">
            <!-- Scrollable API Document View -->
            <div class="main-scrollable-container">
                <div class="content-scrollable" id="main-content-area">
                    <div class="blank-state">
                        <i class="fa-solid fa-diagram-project"></i>
                        <h3>도메인을 탐색해 보세요</h3>
                        <p>좌측 사이드바 트리에서 특정 도메인 패키지를 선택한 뒤, 해당 컨트롤러 및 API 기능을 누르면 세부 DTO 규격과 실시간 성공/실패 시뮬레이터가 기동됩니다.</p>
                    </div>
                </div>
            </div>

            <!-- ==========================================================================
               Live Sandbox API Console Simulator Panel
               ========================================================================== -->
            <aside class="console-panel" id="console-panel-drawer">
                <div class="console-header">
                    <h3><i class="fa-solid fa-terminal"></i> API 대화형 Sandbox</h3>
                    <button class="close-console-btn" onclick="closeConsoleDrawer()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="console-body" id="console-sandbox-body">
                    <!-- Console items loaded dynamically -->
                </div>
            </aside>
        </div>
    </main>

    <!-- ==========================================================================
       Rigorous Core Domain -> Controller -> Endpoint API Database Definition
       ========================================================================== -->
    <script>
        const API_DATABASE = {
        "core": {
                "name": "Core 도메인 (사용자 및 조직)",
                "icon": "fa-solid fa-user-shield",
                "desc": "사용자 계정, 조직 승격/권한 및 프로필 관리를 담당하는 서비스 인프라입니다.",

        // Active Application State Navigation
        let activeDomainKey = null;
        let activeControllerKey = null;
        let activeApiObj = null;

        // On Page Load: Build Sidebar Domain Tree View
        window.addEventListener('DOMContentLoaded', () => {
            buildDomainTreeView();
        });

        // Parse API DATABASE and render Side tree navigation menu
        function buildDomainTreeView() {
            const container = document.getElementById('domain-list-container');
            container.innerHTML = '';

            for (const [domKey, domVal] of Object.entries(API_DATABASE)) {
                const domNode = document.createElement('div');
                domNode.className = 'domain-node';
                domNode.id = `dom-node-${domKey}`;

                // Controllers list builder
                let controllersHTML = '';
                for (const [ctrlKey, ctrlVal] of Object.entries(domVal.controllers)) {
                    let apisHTML = '';
                    ctrlVal.apis.forEach(api => {
                        apisHTML += `
                            <button class="endpoint-btn" id="api-btn-${api.id}" onclick="selectApiEndpoint('${domKey}', '${ctrlKey}', '${api.id}', event)">
                                <span class="endpoint-method ${api.method}">${api.method}</span>
                                <span title="${api.path}">${api.path.length > 28 ? api.path.substring(0, 26) + '...' : api.path}</span>
                            </button>
                        `;
                    });

                    controllersHTML += `
                        <div class="controller-node" id="ctrl-node-${ctrlKey}">
                            <button class="controller-node-header" onclick="toggleControllerNode('${ctrlKey}', event)">
                                <span><i class="fa-solid fa-gears" style="font-size:12px; margin-right:6px; color:var(--color-purple);"></i>${ctrlKey}</span>
                                <i class="fa-solid fa-caret-down domain-node-arrow"></i>
                            </button>
                            <div class="endpoints-list">
                                ${apisHTML}
                            </div>
                        </div>
                    `;
                }

                domNode.innerHTML = `
                    <button class="domain-node-header" onclick="toggleDomainNode('${domKey}')">
                        <div class="domain-node-title">
                            <i class="${domVal.icon}"></i>
                            <span>${domVal.name}</span>
                        </div>
                        <i class="fa-solid fa-chevron-down domain-node-arrow"></i>
                    </button>
                    <div class="controllers-list">
                        <div style="font-size: 11px; color: var(--text-muted); padding: 8px 12px; line-height:1.4; border-bottom:1px solid var(--border-color); margin-bottom:8px;">
                            ${domVal.desc}
                        </div>
                        ${controllersHTML}
                    </div>
                `;
                container.appendChild(domNode);
            }
        }

        // Toggle Domain Node Accordion
        function toggleDomainNode(domKey) {
            const node = document.getElementById(`dom-node-${domKey}`);
            const isActive = node.classList.contains('active');

            // Close all other domains
            document.querySelectorAll('.domain-node').forEach(n => n.classList.remove('active'));

            if (!isActive) {
                node.classList.add('active');
                activeDomainKey = domKey;
            } else {
                activeDomainKey = null;
            }
        }

        // Toggle Controller Node Accordion
        function toggleControllerNode(ctrlKey, event) {
            event.stopPropagation(); // Avoid triggering parent domain collapse
            const node = document.getElementById(`ctrl-node-${ctrlKey}`);
            const isActive = node.classList.contains('active');

            // Close other controllers inside this domain
            document.querySelectorAll('.controller-node').forEach(n => n.classList.remove('active'));

            if (!isActive) {
                node.classList.add('active');
                activeControllerKey = ctrlKey;
            } else {
                activeControllerKey = null;
            }
        }

        // Select API Endpoint View & Bind Simulator
        function selectApiEndpoint(domKey, ctrlKey, apiId, event) {
            event.stopPropagation();
            
            // Deactivate other endpoint buttons
            document.querySelectorAll('.endpoint-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`api-btn-${apiId}`).classList.add('active');

            const apiObj = API_DATABASE[domKey].controllers[ctrlKey].apis.find(api => api.id === apiId);
            activeApiObj = apiObj;

            // Render Center API Details View
            const mainContent = document.getElementById('main-content-area');
            mainContent.innerHTML = `
                <div class="api-detail-view">
                    <div class="api-badge-row">
                        <span class="endpoint-method ${apiObj.method}" style="font-size:12px; padding:4px 10px; width: auto; font-family:'Fira Code', monospace;">${apiObj.method}</span>
                        <span style="font-family:'Fira Code', monospace; font-size:16px; font-weight:700; color:#ffffff;">${apiObj.path}</span>
                    </div>
                    <h1 class="api-detail-title">${apiObj.name}</h1>
                    <p class="api-detail-desc">${apiObj.summary}</p>

                    <h3 class="spec-section-title"><i class="fa-solid fa-code-branch"></i> DTO 데이터 형식 명세 (Data Schema)</h3>
                    <div class="spec-grid">
                        <div class="spec-card">
                            <div class="spec-card-header">
                                <span>HTTP Request Payload DTO</span>
                                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                            </div>
                            <div class="spec-card-body">${apiObj.reqPayload ? JSON.stringify(apiObj.reqPayload, null, 4) : '// Request Payload DTO 없음 (GET / Params)'}</div>
                        </div>
                    </div>

                    <div class="api-view-actions">
                        <button class="btn-open-console" onclick="openInteractiveConsole('${domKey}', '${ctrlKey}', '${apiId}')">
                            <i class="fa-solid fa-terminal"></i> 대화형 Sandbox 기동
                        </button>
                    </div>
                </div>
            `;

            // Auto Close Console Panel Drawer and Reset Sandbox UI
            closeConsoleDrawer();
        }

        // Open Sandbox Console Panel Drawer
        function openInteractiveConsole(domKey, ctrlKey, apiId) {
            const drawer = document.getElementById('console-panel-drawer');
            drawer.style.display = 'flex';
            setTimeout(() => {
                drawer.style.transform = 'translateX(0)';
            }, 50);

            const apiObj = API_DATABASE[domKey].controllers[ctrlKey].apis.find(api => api.id === apiId);
            activeApiObj = apiObj;

            // Generate Case Selector dropdown items
            let caseOptionsHTML = '';
            for (const [caseKey, caseVal] of Object.entries(apiObj.cases)) {
                caseOptionsHTML += `<option value="${caseKey}">${caseVal.title}</option>`;
            }

            const sandboxBody = document.getElementById('console-sandbox-body');
            sandboxBody.innerHTML = `
                <div class="console-info-banner">
                    <div class="console-meta-path">
                        <span class="endpoint-method ${apiObj.method}" style="font-size:9px; padding:1px 4px; border-radius:3px; width:auto; display:inline-block; font-family:'Fira Code', monospace;">${apiObj.method}</span>
                        ${apiObj.path}
                    </div>
                    <span style="font-size:12px; color:var(--text-secondary); font-weight:700;">${apiObj.name}</span>
                </div>

                <div class="case-select-group">
                    <label>성공 및 실패 예외 시나리오 케이스 선택</label>
                    <select class="case-dropdown" id="interactive-case-selector" onchange="handleCaseSwitch(this.value)">
                        ${caseOptionsHTML}
                    </select>
                </div>

                <div class="payload-textarea-container">
                    <label>HTTP Request Body JSON Editor</label>
                    <textarea class="console-payload-field" id="interactive-payload-field" ${apiObj.reqPayload ? '' : 'disabled'}>${apiObj.reqPayload ? JSON.stringify(apiObj.reqPayload, null, 4) : '// DTO가 요구되지 않는 API입니다.'}</textarea>
                </div>

                <button class="btn-console-submit" onclick="submitSandboxRequest()">
                    <i class="fa-solid fa-circle-play"></i> Send API Sandbox Request
                </button>

                <div class="console-response-box" id="sandbox-response-card">
                    <div class="response-bar">
                        <span>Console Response Viewer</span>
                        <span class="response-badge" id="sandbox-response-badge" style="display:none;">200 OK</span>
                    </div>
                    <div class="response-text-viewer" id="sandbox-response-viewer">
                        <div class="blank-state" style="padding:20px; height: 100px;">
                            <i class="fa-solid fa-hourglass-start" style="font-size:24px;"></i>
                            <p style="font-size:11px; max-width:240px;">Send API 버튼을 기동하면 비동기 API 성공/실패 JSON 레코드가 여기에 반환됩니다.</p>
                        </div>
                        <!-- Simulated loading layer -->
                        <div class="response-loader" id="sandbox-loader">
                            <div class="spinner"></div>
                            <span>비동기 API 데이터 조율 중...</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Close Sandbox Panel Drawer
        function closeConsoleDrawer() {
            const drawer = document.getElementById('console-panel-drawer');
            drawer.style.transform = 'translateX(100%)';
            setTimeout(() => {
                drawer.style.display = 'none';
            }, 300);
        }

        // Dynamically change payload text when scenario case switches
        function handleCaseSwitch(caseKey) {
            const payloadField = document.getElementById('interactive-payload-field');
            if (caseKey.startsWith('err_') && activeApiObj.reqPayload) {
                // If it is an error case, modify request values to trigger validation errors
                const modifiedPayload = { ...activeApiObj.reqPayload };
                if (caseKey === 'err_validation') {
                    modifiedPayload.startDate = "2026-12-31";
                    modifiedPayload.endDate = "2026-06-01"; // Intentional Date validation trigger
                } else if (caseKey === 'err_overflow') {
                    modifiedPayload.endDate = "2027-05-15"; // Milestone date overflow
                } else if (caseKey === 'err_password') {
                    modifiedPayload.password = "1234"; // Password length policy issue
                } else if (caseKey === 'err_duplicate') {
                    modifiedPayload.email = "duplicate@hanwha.com"; // Email duplicates issue
                }
                payloadField.value = JSON.stringify(modifiedPayload, null, 4);
            } else if (activeApiObj.reqPayload) {
                payloadField.value = JSON.stringify(activeApiObj.reqPayload, null, 4);
            }
        }

        // Submit Simulator Sandbox Request Action
        function submitSandboxRequest() {
            const payloadField = document.getElementById('interactive-payload-field');
            const caseSelector = document.getElementById('interactive-case-selector');
            const responseCard = document.getElementById('sandbox-response-card');
            const loader = document.getElementById('sandbox-loader');
            const badge = document.getElementById('sandbox-response-badge');
            const viewer = document.getElementById('sandbox-response-viewer');

            // Reset shaking animation
            payloadField.classList.remove('shaking-element');
            responseCard.classList.remove('shaking-element');

            // Validate Payload JSON Syntax
            if (activeApiObj.reqPayload) {
                try {
                    JSON.parse(payloadField.value);
                } catch (e) {
                    payloadField.classList.add('shaking-element');
                    showToastNotification("API 전송 거부 🚨", "Request Body가 올바른 JSON 형식이 아닙니다. 서식을 점검해 주세요.", "error");
                    return;
                }
            }

            // Open Asynchronous Spinner Loading Overlay
            loader.style.display = 'flex';

            // Simulate Asynchronous network lag latency (450ms)
            setTimeout(() => {
                loader.style.display = 'none';

                const chosenCaseKey = caseSelector.value;
                const responseData = activeApiObj.cases[chosenCaseKey];

                if (responseData.isSuccess) {
                    // Success Scenario Flow
                    badge.style.display = 'inline-block';
                    badge.className = 'response-badge';
                    badge.innerText = `Status: 200 OK (${responseData.code})`;

                    viewer.innerHTML = `
                        <pre style="color: #34d399; font-weight: 500; font-family:'Fira Code', monospace; line-height: 1.4;">${JSON.stringify(responseData, null, 4)}</pre>
                        <div class="response-loader" id="sandbox-loader" style="display:none;"><div class="spinner"></div></div>
                    `;

                    showToastNotification(
                        "API 가상 호출 성공 💡",
                        `백엔드 응답 완결: ${responseData.message} [Code: ${responseData.code}]`,
                        "success"
                    );
                } else {
                    // Fail Error Scenario Flow (Triggers robust Shaking layout)
                    responseCard.classList.add('shaking-element');
                    setTimeout(() => responseCard.classList.remove('shaking-element'), 500);

                    badge.style.display = 'inline-block';
                    badge.className = 'response-badge fail';
                    badge.innerText = `Status: Client/Server Exception (${responseData.code})`;

                    viewer.innerHTML = `
                        <pre style="color: #f43f5e; font-weight: 500; font-family:'Fira Code', monospace; line-height: 1.4;">${JSON.stringify(responseData, null, 4)}</pre>
                        <div class="response-loader" id="sandbox-loader" style="display:none;"><div class="spinner"></div></div>
                    `;

                    showToastNotification(
                        "API 가상 예외 발생 🚨",
                        `백엔드 반환 기각: ${responseData.message} [Code: ${responseData.code}]`,
                        "error"
                    );
                }

            }, 450);
        }

        // Show B2B Premium Toast Notification
        function showToastNotification(title, message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type === 'error' ? 'error' : ''}`;
            
            toast.innerHTML = `
                <i class="${type === 'error' ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-circle-check'}"></i>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-body">${message}</div>
                </div>
            `;
            
            container.appendChild(toast);

            // Toast slide-out fade-away
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s cubic-bezier(0.175, 0.885, 0.32, 1) forwards';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }
