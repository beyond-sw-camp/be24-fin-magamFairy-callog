server:
  port: 8080
  error:
    whitelabel:
      enabled: false  # 기본 whitelabel 에러 페이지 비활성화
    path: /error

jdbc:
  datasource:
    proxy:
      logging: true

jwt:
  key: ${JWT_SECRET}
  secret: ${JWT_SECRET}
  expire: ${JWT_EXPIRE}
project:
  aes:
    key: ${AES_SECRET_KEY}
app:
  frontend-url: ${FRONTEND_URL}
  secure-cookie: ${SECURE_COOKIE}
aws:
  s3:
    bucket-name: ${AWS_BUCKET_NAME}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    region: ap-northeast-2
openai:
  image:
    api-key: ${OPEN_API_IMAGE}
    model: ${OPENAI_IMAGE_MODEL}
    quality: ${OPENAI_IMAGE_QUALITY}
admin:
  id: ${ADMIN_ID}
  email: ${ADMIN_EMAIL}
  name: ${ADMIN_NAME}
  role: ${ADMIN_ROLE}
  password: ${ADMIN_PASSWORD}
spring:
  application:
    name: callog-dev
  cache:
    type: redis   # 명시: Redis 미가용 시 부팅 실패(fail-fast) — silent NoOp fallback 방지
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      initialization-fail-timeout: 120000 # 120초 동안은 실패해도 포기하지 않고 재시도
      connection-timeout: 15000 # 15초마다 재시도, 총 4회까지 연결 시도

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    mongodb:
      uri: ${MONGODB_URL}
    # ─────────────────────────────────────────────────────────────────────
    # Redis (Bitnami Sentinel — callog-redis Service in redis-test namespace)
    #   - Sentinel 모드 전용 (master failover 자동 처리, HA)
    #   - 모든 값은 k8s ConfigMap/Secret 에서 환경변수로 주입 — 누락 시 부팅 실패(fail-fast)
    # ─────────────────────────────────────────────────────────────────────
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # Master/Replica 의 AUTH password (Bitnami 기본: 'admin')
      password: ${REDIS_PASSWORD}
      timeout: 5000ms
      sentinel:
        master: ${REDIS_SENTINEL_MASTER}
        # 콤마 구분 — 여러 sentinel: "host1:26379,host2:26379,host3:26379"
        nodes: ${REDIS_SENTINEL_NODES}
        password: ${REDIS_SENTINEL_PASSWORD}
      lettuce:
        pool:
          enabled: true
          max-active: 16       # 동시 명령어 처리 가능 connection 수
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms
        shutdown-timeout: 2000ms   # graceful shutdown 중 in-flight Redis 명령 정리 시간

logging:
  level:
    org.example.backend.matching.service: debug
#    org.hibernate.SQL: debug
#    org.hibernate.orm.jdbc.bind: trace
#    org.example: debug
    net.ttddyy.observation: DEBUG
    # RestClient가 요청을 보내는 과정을 로그로 출력
    org.springframework.web.client: DEBUG
    # HTTP 통신 (헤더, 응답 등)의 아주 상세한 내역을 출력
    org.springframework.http.client: TRACE

custom:
  n8n:
    webhook-url: ${N8N_URL}
    evaluation-endpoint: ${EVALUATION_ENDPOINT}
    check-endpoint: ${CHECK_ENDPOINT}
  ocr:
    url: ${OCR_SERVICE_URL}
    async-enabled: ${OCR_ASYNC_ENABLED}
    job-url: ${OCR_JOB_SERVICE_URL}
    job-poll-interval-ms: ${OCR_JOB_POLL_INTERVAL_MS}
    job-poll-timeout-ms: ${OCR_JOB_POLL_TIMEOUT_MS}
  layout:
    url: ${LAYOUT_SERVICE_URL}
  mongodb:
    analysis-enabled: ${MONGODB_STD_ENABLED:false}
    analysis-uri: ${MONGODB_STD_URL:}
    analysis-database: ${MONGODB_STD_DATABASE:}
    analysis-collection: ${MONGODB_STD_COLLECTION:ad_check_analysis_results}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    #    enabled: false
    sampling:
      probability: 1.0   # 모든 요청에 대한 데이터를 수집하겠다.
  otlp:
    tracing:
      endpoint: ${JAEGER_URL}
      transport: http
