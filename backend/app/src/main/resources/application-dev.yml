server:
  port: 8083
  error:
    whitelabel:
      enabled: false  # 기본 whitelabel 에러 페이지 비활성화
    path: /error

jdbc:
  datasource:
    proxy:
      logging: true

jwt:
  key: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY}
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY}
  expire: ${JWT_EXPIRE:86400000}
project:
  aes:
    key: ${AES_SECRET_KEY:0123456789abcdef0123456789abcdef}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  secure-cookie: ${SECURE_COOKIE:false}
  kafka:
    topics:
      evaluation-start: evaluation.start
      evaluation-collect: evaluation.collect
    consumer:
      propoerties:
        spring.json.use.type.headers: false
msa:
  matching-evaluation:
    base-url: ${EVALUATION_URL:http://localhost:8082}
aws:
  s3:
    bucket-name: ${AWS_BUCKET_NAME:callog-local}
    access-key: ${AWS_ACCESS_KEY:local-access-key}
    secret-key: ${AWS_SECRET_KEY:local-secret-key}
    region: ap-northeast-2
openai:
  image:
    api-key: ${OPEN_API_IMAGE:local-openai-image-key}
    model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
    quality: ${OPENAI_IMAGE_QUALITY:standard}
admin:
  id: ${ADMIN_ID:admin@callog.com}
  email: ${ADMIN_EMAIL:admin@callog.com}
  name: ${ADMIN_NAME:Admin}
  role: ${ADMIN_ROLE:ROLE_ADMIN}
  password: ${ADMIN_PASSWORD:Qwer1234!}
spring:
  application:
    name: app
  cache:
    type: redis   # 명시: Redis 미가용 시 부팅 실패(fail-fast) — silent NoOp fallback 방지
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: "${DB_URL:jdbc:mariadb://localhost:3306/callog?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}"
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    hikari:
      initialization-fail-timeout: 120000 # 120초 동안은 실패해도 포기하지 않고 재시도
      connection-timeout: 15000 # 15초마다 재시도, 총 4회까지 연결 시도

  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false
      data-locations:
        - classpath:db/seed/DummyData.sql
        - classpath:db/seed/TargetAccountsData.sql

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    # ─────────────────────────────────────────────────────────────────────
    # Redis (Bitnami Sentinel — callog-redis Service in redis-test namespace)
    #   - Sentinel 모드 전용 (master failover 자동 처리, HA)
    #   - 모든 값은 k8s ConfigMap/Secret 에서 환경변수로 주입 — 누락 시 부팅 실패(fail-fast)
    # ─────────────────────────────────────────────────────────────────────
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Master/Replica 의 AUTH password (Bitnami 기본: 'admin')
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:}
        # 콤마 구분 — 여러 sentinel: "host1:26379,host2:26379,host3:26379"
        nodes: ${REDIS_SENTINEL_NODES:}
        password: ${REDIS_SENTINEL_PASSWORD:}
      lettuce:
        pool:
          enabled: true
          max-active: 16       # 동시 명령어 처리 가능 connection 수
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms
        shutdown-timeout: 2000ms   # graceful shutdown 중 in-flight Redis 명령 정리 시간

  kafka:
    bootstrap-servers: localhost:9092
    topics:
      evaluation-start: evaluation-start

logging:
  level:
    org.example.backend.matching.service: debug
#    org.hibernate.SQL: debug
#    org.hibernate.orm.jdbc.bind: trace
#    org.example: debug
    net.ttddyy.observation: DEBUG
    # RestClient가 요청을 보내는 과정을 로그로 출력
    org.springframework.web.client: DEBUG
    # HTTP 통신 (헤더, 응답 등)의 아주 상세한 내역을 출력
    org.springframework.http.client: TRACE

custom:
  n8n:
    webhook-url: ${N8N_URL:http://localhost:5678/webhook}
    evaluation-endpoint: ${EVALUATION_ENDPOINT:/evaluation}
    check-endpoint: ${CHECK_ENDPOINT:/check}
  ocr:
    url: ${OCR_SERVICE_URL:http://localhost:8001/ocr}
    async-enabled: ${OCR_ASYNC_ENABLED:true}
    job-url: ${OCR_JOB_SERVICE_URL:http://localhost:8001/ocr/jobs}
    job-poll-interval-ms: ${OCR_JOB_POLL_INTERVAL_MS:1000}
    job-poll-timeout-ms: ${OCR_JOB_POLL_TIMEOUT_MS:120000}
  layout:
    url: ${LAYOUT_SERVICE_URL:http://localhost:8001/v1/layout/analyze}
    api-key: ${LAYOUT_SERVICE_API_KEY:}
  mongodb:
    analysis-enabled: ${MONGODB_STD_ENABLED:false}
    analysis-uri: ${MONGODB_STD_URL:}
    analysis-database: ${MONGODB_STD_DATABASE:}
    analysis-collection: ${MONGODB_STD_COLLECTION:ad_check_analysis_results}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0   # 모든 요청에 대한 데이터를 수집하겠다.
  otlp:
    tracing:
      endpoint: ${JAEGER_URL:http://localhost:4318/v1/traces}
      transport: http
eureka:
  client:
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:false}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:false}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:9090/eureka/}
