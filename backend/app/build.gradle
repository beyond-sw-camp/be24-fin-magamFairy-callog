description = 'app'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.kafka:spring-kafka'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'  // Redis (Lettuce client) — @Cacheable + RefreshTokenRedisService
    implementation 'org.apache.commons:commons-pool2'  // ⭐ Lettuce connection pool 사용 시 필수 (yml 의 lettuce.pool.enabled=true)
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.3.0'
    compileOnly 'org.projectlombok:lombok'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // iCalendar(.ics) 생성/파싱 — 구글 캘린더 가져오기/내보내기 (RFC 5545)
    implementation 'org.mnode.ical4j:ical4j:3.2.14'

    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'io.github.openhtmltopdf:openhtmltopdf-core:1.1.37'
    implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.37'
    implementation 'io.github.openhtmltopdf:openhtmltopdf-slf4j:1.1.37'
    implementation 'software.amazon.awssdk:s3:2.25.70'

    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-spring6:2.2.0'

    // 유레카
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
}
