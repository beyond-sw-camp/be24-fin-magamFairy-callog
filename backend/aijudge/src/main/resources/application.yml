server:
  port: 8081

spring:
  application:
    name: ai-judge
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

aws:
  s3:
    bucket-name: ${AWS_BUCKET_NAME:callog-local}
    access-key: ${AWS_ACCESS_KEY:dummy-access-key}
    secret-key: ${AWS_SECRET_KEY:dummy-secret-key}
    region: ${AWS_REGION:ap-northeast-2}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    #    enabled: false
    sampling:
      probability: 1.0   # 모든 요청에 대한 데이터를 수집하겠다.
  otlp:
    tracing:
      endpoint: ${JAEGER_URL}
      transport: http

ai-judge:
  kafka:
    enabled: ${AI_JUDGE_KAFKA_ENABLED:false}
    completed-topic: ${AI_JUDGE_COMPLETED_TOPIC:ai-judge.completed}
    campaign-sync-enabled: ${AI_JUDGE_CAMPAIGN_SYNC_ENABLED:false}
    campaign-sync-topic: ${CAMPAIGN_SYNC_TOPIC:campaign.sync}
    campaign-sync-group-id: ${AI_JUDGE_CAMPAIGN_SYNC_GROUP_ID:ai-judge-campaign-projection}
  n8n:
    webhook-url: ${N8N_URL:}
    check-endpoint: ${CHECK_ENDPOINT:}

custom:
  ocr:
    url: ${OCR_SERVICE_URL:http://localhost:8000}
    async-enabled: ${OCR_ASYNC_ENABLED:true}
    job-url: ${OCR_JOB_SERVICE_URL:}
    job-poll-interval-ms: ${OCR_JOB_POLL_INTERVAL_MS:1000}
    job-poll-timeout-ms: ${OCR_JOB_POLL_TIMEOUT_MS:180000}
  layout:
    url: ${LAYOUT_SERVICE_URL:http://localhost:8001/v1/layout/analyze}
    api-key: ${LAYOUT_SERVICE_API_KEY:}
  mongodb:
    analysis-enabled: ${MONGODB_STD_ENABLED:false}
    analysis-uri: ${MONGODB_STD_URL:}
    analysis-database: ${MONGODB_STD_DATABASE:}
    analysis-collection: ${MONGODB_STD_COLLECTION:ad_check_analysis_results}
    campaign-enabled: ${MONGODB_CAMPAIGN_SYNC_ENABLED:false}
    campaign-uri: ${MONGODB_CAMPAIGN_SYNC_URL:${MONGODB_STD_URL:}}
    campaign-database: ${MONGODB_CAMPAIGN_SYNC_DATABASE:${MONGODB_STD_DATABASE:}}
    campaign-collection: ${MONGODB_CAMPAIGN_SYNC_COLLECTION:campaign_projection}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI}

