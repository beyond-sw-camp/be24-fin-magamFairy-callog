server:
  port: 8081

spring:
  application:
    name: ai-judge
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

aws:
  s3:
    bucket-name: ${AWS_BUCKET_NAME}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    region: ${AWS_REGION}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    #    enabled: false
    sampling:
      probability: 1.0   # 모든 요청에 대한 데이터를 수집하겠다.
  otlp:
    tracing:
      endpoint: ${JAEGER_URL}
      transport: http

ai-judge:
  kafka:
    enabled: ${AI_JUDGE_KAFKA_ENABLED}
    request-topic: ${AI_JUDGE_REQUEST_TOPIC}
    request-group-id: ${AI_JUDGE_REQUEST_GROUP_ID}
    completed-topic: ${AI_JUDGE_COMPLETED_TOPIC}
    campaign-sync-enabled: ${AI_JUDGE_CAMPAIGN_SYNC_ENABLED}
    campaign-sync-topic: ${CAMPAIGN_SYNC_TOPIC}
    campaign-sync-group-id: ${AI_JUDGE_CAMPAIGN_SYNC_GROUP_ID}
  n8n:
    webhook-url: ${N8N_URL}
    check-endpoint: ${CHECK_ENDPOINT}

custom:
  ocr:
    url: ${OCR_SERVICE_URL}
    async-enabled: ${OCR_ASYNC_ENABLED}
    job-url: ${OCR_JOB_SERVICE_URL}
    job-poll-interval-ms: ${OCR_JOB_POLL_INTERVAL_MS}
    job-poll-timeout-ms: ${OCR_JOB_POLL_TIMEOUT_MS}
  layout:
    url: ${LAYOUT_SERVICE_URL}
    api-key: ${LAYOUT_SERVICE_API_KEY}
  mongodb:
    analysis-enabled: ${MONGODB_STD_ENABLED}
    analysis-uri: ${MONGODB_STD_URL}
    analysis-database: ${MONGODB_STD_DATABASE}
    analysis-collection: ${MONGODB_STD_COLLECTION}
    campaign-enabled: ${MONGODB_CAMPAIGN_SYNC_ENABLED}
    campaign-uri: ${MONGODB_CAMPAIGN_SYNC_URL:${MONGODB_STD_URL:}}
    campaign-database: ${MONGODB_CAMPAIGN_SYNC_DATABASE:${MONGODB_STD_DATABASE:}}
    campaign-collection: ${MONGODB_CAMPAIGN_SYNC_COLLECTION}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI}

