eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: APP service
        url: /app/v3/api-docs
      - name: Matching Evaluation service
        url: /evaluation/v3/api-docs
      - name: AI Judge service
        url: /aijudge/v3/api-docs
