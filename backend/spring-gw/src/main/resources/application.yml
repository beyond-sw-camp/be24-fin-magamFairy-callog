spring:
  application:
    name: spring-gw
  cloud:
    gateway:
      routes:
        - id: gateway-local-info
          uri: noop://localhost
          predicates:
            - Path=/gw/**
          filters:
            - StripPrefix=1

        - id: ai-judge
          uri: lb://ai-judge
          predicates:
            - Path=/aijudge/**

        - id: ai-evaluation
          uri: lb://ai-evaluation
          predicates:
            - Path=/evaluation/**

        - id: callog
          uri: lb://callog
          predicates:
            - Path=/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI}