server:
  port: 8080

jwt:
  # JWT 서명에 사용할 비밀키 (보안 필수 변수)
  key: ${JWT_SECRET:default_development_jwt_secret_key_string_32_bytes_long}

spring:
  application:
    name: spring-gw
  cloud:
    gateway:
      routes:
        # ai 판사
        - id: gateway-local-info
          uri: noop://localhost
          predicates:
            - Path=/gw/**
          filters:
            - StripPrefix=1

        - id: app-api-docs
          uri: ${APP_URI:lb://app}
          predicates:
            - Path=/app/v3/api-docs,/app/v3/api-docs/**
          filters:
            - RewritePath=/app(?<segment>/v3/api-docs.*), $\{segment}

        - id: ai-judge-api-docs
          uri: ${AI_JUDGE_URI:lb://ai-judge}
          predicates:
            - Path=/aijudge/v3/api-docs,/aijudge/v3/api-docs/**
          filters:
            - RewritePath=/aijudge(?<segment>/v3/api-docs.*), $\{segment}

        - id: matching-evaluation-api-docs
          uri: ${EVALUATION_URL:lb://matching-evaluation}
          predicates:
            - Path=/evaluation/v3/api-docs,/evaluation/v3/api-docs/**
          filters:
            - RewritePath=/evaluation(?<segment>/v3/api-docs.*), $\{segment}

        - id: ai-judge-actuator
          uri: ${AI_JUDGE_URI:lb://ai-judge}
          predicates:
            - Path=/aijudge/actuator/**
          filters:
            - StripPrefix=1

        - id: ai-judge
          uri: ${AI_JUDGE_URI:lb://ai-judge}
          predicates:
            - Path=/aijudge/**
          filters:
            - JwtFilter

        - id: matching-evaluation-actuator
          uri: ${EVALUATION_URL:lb://matching-evaluation}
          predicates:
            - Path=/evaluation/actuator/**
          filters:
            - StripPrefix=1

        - id: matching-evaluation
          uri: ${EVALUATION_URL:lb://matching-evaluation}
          predicates:
            - Path=/evaluation/**

        - id: app
          uri: ${APP_URI:lb://app}
          predicates:
            - Path=/**
          filters:
            - JwtFilter
