plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'java'
}

description = 'spring-gw'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// 1. 라이브러리를 다운로드할 저장소 지정 (필수)
repositories {
	mavenCentral()
}

// 2. Spring Cloud 버전을 일관되게 관리하기 위한 변수 선언
ext {
	set('springCloudVersion', "2025.0.0") // 현재 사용 중인 Boot 버전에 맞춰 조절 가능
}

dependencies {
	// server-webmvc 대신 넷티 기반의 표준 게이트웨이 라이브러리 사용
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 3. Spring Cloud 의존성들의 버전을 자동으로 맞춰주는 BOM 추가 (필수)
dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}